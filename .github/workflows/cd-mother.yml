name: CD Mother Company (Zero-Downtime EC2)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Zero-Downtime EC2 PM2 Deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure SSH Credentials
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.EC2_PORT || 22 }} ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Zero-Downtime CD Pipeline
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          PORT: ${{ secrets.EC2_PORT || 22 }}
          APP_DIR: ${{ secrets.EC2_APP_DIR || '/var/www/music-distribution-platform' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p $PORT $USER@$HOST "bash -s -- \"$APP_DIR\"" << 'EOF'
            set -euo pipefail

            APP_DIR="${1:-/var/www/music-distribution-platform}"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:/usr/local/bin:/usr/bin:/bin:$PATH"

            if [ -d "$HOME/.nvm" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi

            echo "🚀 [CD] Connecting to application directory: $APP_DIR"
            cd "$APP_DIR"

            PREV_COMMIT=$(git rev-parse HEAD)
            echo "📌 Current Active Commit: $PREV_COMMIT"

            cleanup_on_error() {
              echo "❌ [CD] Error detected! Initiating emergency rollback to $PREV_COMMIT..."
              cd "$APP_DIR"
              git reset --hard "$PREV_COMMIT"
              pm2 reload ecosystem.config.js --update-env || true
              exit 1
            }
            trap cleanup_on_error ERR

            if [ -f "$APP_DIR/api/.env" ]; then
              sed -i 's/DATABASE_URL="DATABASE_URL="/DATABASE_URL="/g' "$APP_DIR/api/.env"
            fi

            echo "📥 [CD] Fetching latest commit from origin/master..."
            git fetch origin master
            git reset --hard origin/master

            echo "📦 [Deploy] Executing Mother Company zero-downtime deployment script..."
            chmod +x "$APP_DIR/scripts/deploy-mother-company.sh"
            "$APP_DIR/scripts/deploy-mother-company.sh"

            trap - ERR
            echo "🎉 [Success] Zero-downtime deployment finished cleanly on Mother Company EC2!"
          EOF
