name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-api:
    name: Lint, Test, & Build API Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: music_distribution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter api exec prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/music_distribution_test
        run: pnpm --filter api exec prisma generate

      - name: Run ESLint
        run: pnpm --filter api run lint

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/music_distribution_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-super-secret-jwt-key-for-ci-testing-minimum-32-chars
          NODE_ENV: test
        run: pnpm --filter api test -- --passWithNoTests

      - name: Build API Production Bundle
        run: pnpm --filter api run build

  validate-platform:
    name: Lint, Typecheck, & Build Platform Console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript Types
        run: pnpm --filter platform exec tsc --noEmit

      - name: Run ESLint
        run: pnpm --filter platform run lint

      - name: Build Platform Console
        env:
          NEXT_PUBLIC_APP_URL: "https://platform.royalmotionit.com"
          API_BASE_URL: "http://127.0.0.1:5000"
          API_KEY: "ci-mock-platform-api-key"
          INTERNAL_API_SECRET: "ci-mock-internal-api-secret-key-32charsmin!"
          SKIP_ENV_VALIDATION: "1"
        run: pnpm --filter platform run build

  validate-whitelabel:
    name: Lint, Typecheck, & Build WhiteLabel Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript Types
        run: pnpm --filter whitelabel exec tsc --noEmit

      - name: Run ESLint
        run: pnpm --filter whitelabel run lint

      - name: Build WhiteLabel Portal
        env:
          API_BASE_URL: "http://127.0.0.1:5000"
          API_KEY: "ci-mock-whitelabel-api-key"
          INTERNAL_API_SECRET: "ci-mock-internal-api-secret-key-32charsmin!"
          SKIP_ENV_VALIDATION: "1"
        run: pnpm --filter whitelabel run build
