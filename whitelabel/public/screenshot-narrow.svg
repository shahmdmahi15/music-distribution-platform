<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334">
  <defs>
    <linearGradient id="bgMobileWl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryCardWl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="750" height="1334" fill="url(#bgMobileWl)"/>

  <!-- Status Bar / Dynamic Island -->
  <rect x="0" y="0" width="750" height="60" fill="#030712"/>
  <rect x="275" y="15" width="200" height="30" rx="15" fill="#000000"/>
  <text x="60" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">9:41</text>

  <!-- Header -->
  <rect x="0" y="60" width="750" height="70" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  <text x="40" y="103" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Backstage Portal</text>
  <circle cx="700" cy="95" r="20" fill="#6366f1"/>
  <text x="700" y="101" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BP</text>

  <!-- Welcome Card -->
  <rect x="30" y="160" width="690" height="180" rx="20" fill="url(#primaryCardWl)" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="60" y="210" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="16" font-weight="600">ARTIST DISTRIBUTION</text>
  <text x="60" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="extrabold">Welcome back, Luna!</text>
  <text x="60" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Your catalog is live across global streaming platforms.</text>

  <!-- Quick Action Buttons -->
  <rect x="30" y="365" width="330" height="75" rx="16" fill="#6366f1" stroke="#4f46e5" stroke-width="1"/>
  <text x="60" y="410" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">+ Create Release</text>

  <rect x="390" y="365" width="330" height="75" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="420" y="410" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="semibold">VEVO Request</text>

  <!-- Metric Summary -->
  <rect x="30" y="465" width="690" height="140" rx="18" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="60" y="505" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="600">MONTHLY ROYALTY PAYOUT</text>
  <text x="60" y="555" fill="#10b981" font-family="system-ui, sans-serif" font-size="36" font-weight="extrabold">$14,820.50</text>
  <text x="60" y="585" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">≈ ৳1,778,460 BDT (Live Rate: 120.00)</text>

  <!-- Recent Catalog List -->
  <text x="35" y="645" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Recent Releases</text>

  <rect x="30" y="665" width="690" height="90" rx="16" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <rect x="50" y="680" width="60" height="60" rx="10" fill="#6366f1"/>
  <text x="130" y="710" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Midnight Serenade</text>
  <text x="130" y="732" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Luna Eclipse • Single</text>
  <rect x="590" y="695" width="110" height="30" rx="6" fill="#065f46"/>
  <text x="645" y="715" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">LIVE</text>

  <rect x="30" y="770" width="690" height="90" rx="16" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <rect x="50" y="785" width="60" height="60" rx="10" fill="#ec4899"/>
  <text x="130" y="815" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Velvet Sky</text>
  <text x="130" y="837" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Luna Eclipse • Music Video</text>
  <rect x="590" y="800" width="110" height="30" rx="6" fill="#1e3a8a"/>
  <text x="645" y="820" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">VEVO IN REVIEW</text>

  <!-- Mobile Bottom Nav -->
  <rect x="0" y="1234" width="750" height="100" fill="#030712" stroke="#1f2937" stroke-width="1"/>
  <text x="100" y="1285" fill="#6366f1" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Home</text>
  <text x="280" y="1285" fill="#64748b" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Releases</text>
  <text x="460" y="1285" fill="#64748b" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Channels</text>
  <text x="640" y="1285" fill="#64748b" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Reports</text>
</svg>
