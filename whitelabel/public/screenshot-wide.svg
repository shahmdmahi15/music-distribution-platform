<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgWl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradWl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGradWl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgWl)"/>

  <!-- Top Titlebar / PWA Overlay -->
  <rect x="0" y="0" width="1280" height="40" fill="#030712" stroke="#1f2937" stroke-width="1"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#10b981"/>
  <text x="640" y="24" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Backstage Music Portal - Artist Distribution Suite</text>

  <!-- Sidebar -->
  <rect x="0" y="40" width="220" height="680" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  <rect x="20" y="60" width="180" height="32" rx="8" fill="url(#accentGradWl)"/>
  <text x="110" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Backstage Portal</text>

  <!-- Nav Items -->
  <rect x="16" y="110" width="188" height="32" rx="6" fill="#1e1b4b"/>
  <text x="48" y="130" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dashboard</text>

  <rect x="16" y="150" width="188" height="32" rx="6" fill="transparent"/>
  <text x="48" y="170" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Releases Catalog</text>

  <rect x="16" y="190" width="188" height="32" rx="6" fill="transparent"/>
  <text x="48" y="210" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">VEVO Channels</text>

  <rect x="16" y="230" width="188" height="32" rx="6" fill="transparent"/>
  <text x="48" y="250" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Royalty Reports</text>

  <rect x="16" y="270" width="188" height="32" rx="6" fill="transparent"/>
  <text x="48" y="290" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Split Contracts</text>

  <!-- Main Content Area -->
  <text x="250" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Artist Dashboard</text>
  <text x="250" y="102" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Direct Digital Distribution to Spotify, Apple Music, and VEVO</text>

  <!-- Metric Cards -->
  <rect x="250" y="125" width="235" height="110" rx="12" fill="url(#cardGradWl)" stroke="#312e81" stroke-width="1"/>
  <text x="270" y="155" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ROYALTIES BALANCE</text>
  <text x="270" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">$14,820.50</text>
  <text x="270" y="215" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">+14.2% • ৳1.77M BDT</text>

  <rect x="500" y="125" width="235" height="110" rx="12" fill="url(#cardGradWl)" stroke="#312e81" stroke-width="1"/>
  <text x="520" y="155" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STREAMING VELOCITY</text>
  <text x="520" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">1.84M Streams</text>
  <text x="520" y="215" fill="#6366f1" font-family="system-ui, sans-serif" font-size="11">56% Spotify • 28% Apple</text>

  <rect x="750" y="125" width="235" height="110" rx="12" fill="url(#cardGradWl)" stroke="#312e81" stroke-width="1"/>
  <text x="770" y="155" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CATALOG DELIVERIES</text>
  <text x="770" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">28 Tracks</text>
  <text x="770" y="215" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">24 Distributed • 4 In Review</text>

  <rect x="1000" y="125" width="250" height="110" rx="12" fill="url(#cardGradWl)" stroke="#312e81" stroke-width="1"/>
  <text x="1020" y="155" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">VEVO NETWORK</text>
  <text x="1020" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">LunaEclipseVEVO</text>
  <text x="1020" y="215" fill="#ec4899" font-family="system-ui, sans-serif" font-size="11">Official Channel Verified</text>

  <!-- Large Data Table Card -->
  <rect x="250" y="255" width="1000" height="430" rx="12" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="270" y="285" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Recent Releases &amp; Master Waveform Inspection</text>

  <!-- Table Header -->
  <rect x="250" y="300" width="1000" height="35" fill="#1e293b"/>
  <text x="270" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">COVER</text>
  <text x="360" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TITLE</text>
  <text x="600" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TYPE</text>
  <text x="750" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">UPC / CODE</text>
  <text x="940" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATUS</text>
  <text x="1150" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PREVIEW</text>

  <!-- Rows -->
  <line x1="250" y1="380" x2="1250" y2="380" stroke="#1f2937" stroke-width="1"/>
  <rect x="270" y="347" width="26" height="26" rx="4" fill="#6366f1"/>
  <text x="360" y="364" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Midnight Serenade</text>
  <text x="600" y="364" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">SINGLE</text>
  <text x="750" y="364" fill="#94a3b8" font-family="monospace" font-size="11">RMIT0091823</text>
  <rect x="940" y="352" width="90" height="20" rx="4" fill="#065f46"/>
  <text x="985" y="366" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DISTRIBUTED</text>
  <text x="1170" y="364" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Play Lossless</text>
</svg>
