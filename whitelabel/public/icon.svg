<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rmit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="8" />
  
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Central Audio Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#rmit-grad)" stroke-width="10" opacity="0.85" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />
    <circle cx="0" cy="0" r="26" fill="url(#rmit-grad)" />

    <!-- Waveform Frequency Bars -->
    <rect x="-85" y="-30" width="9" height="60" rx="4.5" fill="url(#rmit-grad)" />
    <rect x="-55" y="-55" width="9" height="110" rx="4.5" fill="url(#rmit-grad)" />
    <rect x="-25" y="-80" width="9" height="160" rx="4.5" fill="url(#rmit-grad)" />
    <rect x="16" y="-80" width="9" height="160" rx="4.5" fill="url(#rmit-grad)" />
    <rect x="46" y="-55" width="9" height="110" rx="4.5" fill="url(#rmit-grad)" />
    <rect x="76" y="-30" width="9" height="60" rx="4.5" fill="url(#rmit-grad)" />
  </g>
</svg>
